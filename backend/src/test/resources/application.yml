spring:
  application:
    name: dossia-backend-test
  datasource:
    url: jdbc:h2:mem:dossia_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

dossia:
  security:
    jwt:
      secret: "dossia-test-jwt-secret-key-32-chars-minimum-for-hmac-sha256!"
      expiration-ms: 86400000
  minio:
    endpoint: http://localhost:9000
    access-key: test-access-key
    secret-key: test-secret-key
