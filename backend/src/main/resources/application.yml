spring:
  application:
    name: dossia-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dossia_db}
    username: ${DB_USER:dossia_user}
    password: ${DB_PASSWORD:dossia_dev_password_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

dossia:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:dossia_minio_admin}
    secret-key: ${MINIO_SECRET_KEY:dossia_minio_dev_secret_2026}
    bucket-name: ${MINIO_BUCKET:dossia-medical-vault}

server:
  port: 8080
  forward-headers-strategy: framework

