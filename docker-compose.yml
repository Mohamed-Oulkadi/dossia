# ==============================================================================
# Dossia — Master Docker Compose Orchestration
# Unified SaaS Reverse Proxy Architecture with CNDP Loi 09-08 Network Isolation
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Database Tier: PostgreSQL 16 (Strictly isolated on backend-net)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: dossia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dossia_db}
      POSTGRES_USER: ${DB_USER:-dossia_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dossia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dossia_user} -d ${DB_NAME:-dossia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-net
    # Bound to 127.0.0.1 for local host dev (isolated from external networks per CNDP audit)
    ports:
      - "127.0.0.1:5432:5432"

  # ----------------------------------------------------------------------------
  # 1b. Object Storage Tier: MinIO S3 Vault (Strictly isolated on backend-net)
  # ----------------------------------------------------------------------------
  minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: dossia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-dossia_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - backend-net
    # Bound to 127.0.0.1 for local dev inspection & host backend integration
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # ----------------------------------------------------------------------------
  # 1c. Secret Management Tier: HashiCorp Vault Community Edition (SEC-01)
  # ----------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.15.6
    container_name: dossia-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-dossia_vault_dev_root_token_2026}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"
    networks:
      - backend-net
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. Application Tier: Spring Boot 3 / Java 21 Modular Monolith
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dossia-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      vault:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dossia_db}
      DB_USER: ${DB_USER:-dossia_user}
      DB_PASSWORD: ${DB_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dossia_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-dossia-medical-vault}
      DOSSIA_AI_API_KEY: ${DOSSIA_AI_API_KEY:-}
      DOSSIA_AI_BASE_URL: ${DOSSIA_AI_BASE_URL:-https://radoxai.com/v1}
      DOSSIA_AI_MODEL: ${DOSSIA_AI_MODEL:-gpt-4o-mini}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-dossia_vault_dev_root_token_2026}
      VAULT_SECRET_PATH: secret/data/dossia
      DOSSIA_VAULT_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - backend-net
      - frontend-net
    # Bound to 127.0.0.1 for local Vite dev server proxying (npm run dev on :5173 -> :8080)
    ports:
      - "127.0.0.1:8080:8080"

  # ----------------------------------------------------------------------------
  # 3. Web Client Tier: React 18 / Vite SPA (Internal Nginx server)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dossia-frontend
    restart: unless-stopped
    networks:
      - frontend-net
    # Port 80 is internal only; traffic is accessed exclusively through the gateway

  # ----------------------------------------------------------------------------
  # 4. Gateway Tier: Nginx Unified Reverse Proxy
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: dossia-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      # - "443:443" # Reserved for production TLS / Let's Encrypt certificates
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-net

# ==============================================================================
# Network & Volume Definitions
# ==============================================================================
networks:
  # Backend network: db, minio & backend; isolated from external interfaces via 127.0.0.1 port binds
  backend-net:
    driver: bridge

  # DMZ network: backend, frontend, and nginx reverse proxy
  frontend-net:
    driver: bridge

volumes:
  dossia_pgdata:
    driver: local
  minio_data:
    driver: local
  vault_data:
    driver: local
