# ==============================================================================
# Dossia — Master Docker Compose Orchestration
# Unified SaaS Reverse Proxy Architecture with CNDP Loi 09-08 Network Isolation
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Database Tier: PostgreSQL 16 (Strictly isolated on backend-net)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: dossia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dossia_db
      POSTGRES_USER: dossia_user
      POSTGRES_PASSWORD: dossia_dev_password_2026
    volumes:
      - dossia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dossia_user -d dossia_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-net
    # Bound to 127.0.0.1 for local host dev (isolated from external networks per CNDP audit)
    ports:
      - "127.0.0.1:5432:5432"

  # ----------------------------------------------------------------------------
  # 1b. Object Storage Tier: MinIO S3 Vault (Strictly isolated on backend-net)
  # ----------------------------------------------------------------------------
  minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: dossia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dossia_minio_admin
      MINIO_ROOT_PASSWORD: dossia_minio_dev_secret_2026
    volumes:
      - minio_data:/data
    networks:
      - backend-net
    # Bound to 127.0.0.1 for local dev inspection & host backend integration
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # ----------------------------------------------------------------------------
  # 2. Application Tier: Spring Boot 3 / Java 21 Modular Monolith
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dossia-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: dossia_db
      DB_USER: dossia_user
      DB_PASSWORD: dossia_dev_password_2026
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: dossia_minio_admin
      MINIO_SECRET_KEY: dossia_minio_dev_secret_2026
      MINIO_BUCKET: dossia-medical-vault
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - backend-net
      - frontend-net
    # Port 8080 is internal only; traffic is strictly routed via Nginx reverse proxy

  # ----------------------------------------------------------------------------
  # 3. Web Client Tier: React 18 / Vite SPA (Internal Nginx server)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dossia-frontend
    restart: unless-stopped
    networks:
      - frontend-net
    # Port 80 is internal only; traffic is accessed exclusively through the gateway

  # ----------------------------------------------------------------------------
  # 4. Gateway Tier: Nginx Unified Reverse Proxy
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: dossia-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      # - "443:443" # Reserved for production TLS / Let's Encrypt certificates
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-net

# ==============================================================================
# Network & Volume Definitions
# ==============================================================================
networks:
  # Backend network: db, minio & backend; isolated from external interfaces via 127.0.0.1 port binds
  backend-net:
    driver: bridge

  # DMZ network: backend, frontend, and nginx reverse proxy
  frontend-net:
    driver: bridge

volumes:
  dossia_pgdata:
    driver: local
  minio_data:
    driver: local
