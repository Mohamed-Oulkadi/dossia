# ==============================================================================
# Dossia SaaS — Production Nginx Reverse Proxy Configuration
# CNDP (Loi 09-08) & OWASP Compliant Reverse Proxy
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # 1. Upload Limits: 10M for digitized medical certificates, scans, and clinic logos
    client_max_body_size 10M;

    # 2. Standard Security Headers (CNDP & Healthcare Data Protection)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 2.5. Dedicated SSE Streaming Configuration (Waiting Room Real-Time Sync)
    location /api/v1/agenda/stream {
        proxy_pass http://backend:8080/api/v1/agenda/stream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;

        # Mandatory CNDP Real Client IP & Audit Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. API Routing: Route all /api/ traffic to Spring Boot Backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        # Mandatory CNDP Real Client IP & Audit Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Gateway Timeout Tuning for Long Clinical Operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # WebSocket support (if needed for real-time agenda updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 4. Frontend Routing: Route all other traffic to React 18 / Vite SPA
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Vite HMR (in dev/staging environments)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
